name: rule-dates
description: Fail when a constitution rule has no date, or its text changed without its changed date (G-CON-8).

inputs:
  files:
    description: The constitution files, as space-separated patterns from the repository root.
    default: constitution/*.md
  base:
    description: The revision to compare with, a pull request's base or a push's before. Empty or all zeros checks the dates only.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false
    # The action is downloaded with its whole repository, so the checker is built from its own folder.
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/rule-dates" .
    - shell: bash
      env:
        FILES: ${{ inputs.files }}
        BASE: ${{ inputs.base }}
      run: |
        read -ra patterns <<< "$FILES"
        "$RUNNER_TEMP/rule-dates" check -base "$BASE" "${patterns[@]}"
