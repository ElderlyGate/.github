name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels the older run of the same branch.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next-version:
    # A public repo: GitHub's machines cost it nothing, and an own runner would run any fork's PR on the owner's Mac.
    name: github · linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: bash .github/scripts/next-version_test.sh
      - run: bash .github/scripts/image-tags_test.sh

  # A workspace an earlier job left sparse, as an own runner keeps it: after unsparse, actions/checkout fills the whole tree.
  unsparse:
    name: github · unsparse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            README.md
            .github/actions/unsparse
          sparse-checkout-cone-mode: false
      - run: test ! -e templates
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: test -d templates && test -f .github/scripts/next-version.sh

  image:
    name: github · image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # This branch's action, not main's, so a change to it is tested before it merges.
      - uses: ./.github/actions/image
        with:
          tag: v1.2.3
          # This repository's own name, .github, is no image name.
          name: ghcr.io/elderlygate/image-test
          target: run
          version-arg: VERSION
          context: .github/actions/image/testdata
          push: "false"

  rule-dates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/actions/rule-dates
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .github/actions/rule-dates/go.mod
          cache: false
      - run: go vet ./... && go test ./...
