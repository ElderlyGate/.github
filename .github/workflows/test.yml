name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels the older run of the same branch.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next-version:
    # A public repo: GitHub's machines cost it nothing, and an own runner would run any fork's PR on the owner's Mac.
    name: github · linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash .github/scripts/next-version_test.sh
