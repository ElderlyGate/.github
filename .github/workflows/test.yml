name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels the older run of the same branch.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next-version:
    name: local · linux
    runs-on: [self-hosted, eg-linux]
    steps:
      - uses: actions/checkout@v5
      - run: bash .github/scripts/next-version_test.sh
