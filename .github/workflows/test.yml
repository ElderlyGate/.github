name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels the older run of the same branch.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next-version:
    # A public repo: GitHub's machines cost it nothing, and an own runner would run any fork's PR on the owner's Mac.
    name: github · linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: bash .github/scripts/next-version_test.sh

  rule-dates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/actions/rule-dates
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .github/actions/rule-dates/go.mod
          cache: false
      - run: go vet ./... && go test ./...
