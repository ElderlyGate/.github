name: design-check

# G-PLAN-9: a pull request that changes code changes the design in the same pull request.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  design-check:
    # A private repository runs it on the org's own runners (GitHub's minutes are for releases); a public one on
    # GitHub's machines, free for it, and never on ours: a fork's pull request must not run on a Mac in the org.
    name: ${{ github.event.repository.private && 'local · design-check' || 'github · design-check' }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","eg-linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # A `uses:` cannot be an expression, so this cannot follow the ref the caller pins;
      # the template calls this workflow @main, and the action follows main with it.
      - uses: ElderlyGate/.github/.github/actions/design-check@main
        with:
          base: ${{ github.event.pull_request.base.sha }}
          labels: ${{ join(github.event.pull_request.labels.*.name, ',') }}
